name: Update GitLab Stats

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitLab stats and generate SVG
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_USER: axel19911
        run: |
          python3 - << 'EOF'
          import os, urllib.request, json
          from datetime import datetime, timedelta

          token = os.environ["GITLAB_TOKEN"]
          headers = {"PRIVATE-TOKEN": token}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())

          user = get_json("https://gitlab.com/api/v4/user")
          uid = user["id"]

          dates = set()
          total_commits = 0
          page = 1
          while page <= 20:
              events = get_json(f"https://gitlab.com/api/v4/users/{uid}/events?action=pushed&per_page=100&page={page}")
              if not events:
                  break
              for e in events:
                  d = e["created_at"][:10]
                  dates.add(d)
                  total_commits += e.get("push_data", {}).get("commit_count", 1)
              page += 1

          sorted_days = sorted(datetime.strptime(d, "%Y-%m-%d").date() for d in dates)
          longest = 0
          cur = 0
          prev = None
          for d in sorted_days:
              if prev and (d - prev).days == 1:
                  cur += 1
              else:
                  cur = 1
              longest = max(longest, cur)
              prev = d

          today = datetime.utcnow().date()
          current_streak = 0
          check = today
          while check in sorted_days or (check == today and (today - timedelta(days=1)) in sorted_days):
              if check in sorted_days:
                  current_streak += 1
                  check -= timedelta(days=1)
              else:
                  check -= timedelta(days=1)

          svg = f'''<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#1a1b27" stroke="#1a1b27"/>
            <text x="25" y="35" fill="#70a5fd" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="18" font-weight="700">GitLab Contributions (axel19911)</text>
            
            <text x="85" y="95" text-anchor="middle" fill="#70a5fd" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="28" font-weight="700">{total_commits}</text>
            <text x="85" y="122" text-anchor="middle" fill="#a9b1d6" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">Total Commits</text>
            <text x="85" y="142" text-anchor="middle" fill="#38bdae" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11">Private + Public</text>

            <line x1="165" y1="60" x2="165" y2="155" stroke="#414868" stroke-width="1"/>

            <text x="247" y="95" text-anchor="middle" fill="#bf91f3" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="28" font-weight="700">{current_streak}</text>
            <text x="247" y="122" text-anchor="middle" fill="#bf91f3" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13" font-weight="700">Current Streak</text>
            <text x="247" y="142" text-anchor="middle" fill="#38bdae" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11">Days</text>

            <line x1="330" y1="60" x2="330" y2="155" stroke="#414868" stroke-width="1"/>

            <text x="412" y="95" text-anchor="middle" fill="#70a5fd" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="28" font-weight="700">{longest}</text>
            <text x="412" y="122" text-anchor="middle" fill="#a9b1d6" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="13">Longest Streak</text>
            <text x="412" y="142" text-anchor="middle" fill="#38bdae" font-family="Segoe UI, Ubuntu, Sans-Serif" font-size="11">Days</text>
          </svg>'''

          with open("gitlab-stats.svg", "w") as f:
              f.write(svg)
          EOF

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitlab-stats.svg
          git diff --staged --quiet || git commit -m "Update GitLab stats"
          git push
